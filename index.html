  <style>
    :root {
      --bg-light: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --border-color: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-light);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 50%;
    }
    .brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    #map { flex: 1; width: 100%; height: calc(100vh - 60px); background: #e0f2fe; }

    .info-panel {
      position: absolute;
      top: 76px; right: 24px;
      width: 410px;
      max-height: calc(100vh - 110px);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 22px;
      box-shadow: var(--shadow);
      z-index: 1000;
      overflow-y: auto;
    }

    .info-panel h2 { font-size: 1.3rem; margin-bottom: 2px; color: var(--text-main); }
    .info-panel .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; font-weight: 600; }

    .haplo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .haplo-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; }
    .haplo-card .label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); display: block; }
    .haplo-card .val { font-size: 0.92rem; font-weight: 700; color: var(--accent); margin-top: 2px; }

    .history-section h4 { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
    .history-section p { font-size: 0.88rem; line-height: 1.55; color: #334155; }

    .leaflet-tooltip.genomic-tooltip {
      background: rgba(15, 23, 42, 0.92);
      border: none; color: #ffffff;
      font-family: 'Inter', sans-serif; font-size: 0.85rem;
      border-radius: 6px; padding: 6px 10px; font-weight: 600;
    }
  </style>
</head>

    const map = L.map('map', { center: [20.0, 15.0], zoom: 3, zoomControl: false });
    L.control.zoom({ position: 'topleft' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    let geojsonLayer;

    // Helper for fallback color generation
    function generateNationalColor(iso) {
      let hash = 0;
      for (let i = 0; i < iso.length; i++) {
        hash = iso.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      return `hsl(${h}, 65%, 50%)`;
    }

    // Load World GeoJSON boundaries
    fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
      .then(res => res.json())
      .then(worldGeoJson => {
        
        geojsonLayer = L.geoJSON(worldGeoJson, {
          style: function(feature) {
            const iso = feature.id || feature.properties.ISO_A3;
            const countryData = genomicDatabase[iso];
            const fillColor = countryData ? countryData.color : generateNationalColor(iso);

            return {
              fillColor: fillColor,
              weight: 1,
              opacity: 0.8,
              color: '#ffffff',
              fillOpacity: 0.68
            };
          },
          onEachFeature: function(feature, layer) {
            const iso = feature.id || feature.properties.ISO_A3;
            const countryName = feature.properties.name || "Sovereign Nation";
            
            const data = genomicDatabase[iso] || {
              country: countryName,
              ethnicity: `Population of ${countryName}`,
              yDna: "Regional Lineage Data",
              mtDna: "Regional Lineage Data",
              color: generateNationalColor(iso),
              history: `Geographic border region covering ${countryName} [ISO: ${iso}].`
            };

            layer.bindTooltip(data.country, { className: 'genomic-tooltip', direction: 'auto' });

            layer.on({
              mouseover: function(e) {
                const l = e.target;
                l.setStyle({ weight: 2.5, color: '#0f172a', fillOpacity: 0.9 });
                l.bringToFront();
                updatePanel(data);
              },
              mouseout: function(e) {
                geojsonLayer.resetStyle(e.target);
              },
              click: function(e) {
                map.fitBounds(e.target.getBounds(), { padding: [30, 30] });
                updatePanel(data);
              }
            });
          }
        }).addTo(map);
      })
      .catch(err => console.error("Error loading map boundary files:", err));

    function updatePanel(props) {
      const panel = document.getElementById('panelContent');
      panel.innerHTML = `
        <h2>${props.country}</h2>
        <div class="subtitle">${props.ethnicity}</div>
        
        <div class="haplo-grid">
          <div class="haplo-card">
            <span class="label">Border Y-DNA Profile</span>
            <span class="val">${props.yDna}</span>
          </div>
          <div class="haplo-card">
            <span class="label">Border mtDNA Profile</span>
            <span class="val">${props.mtDna}</span>
          </div>
        </div>

        <div class="history-section">
          <h4>In-Border Archaeo-Genetic Evidence</h4>
          <p>${props.history}</p>
        </div>
      `;
    }
